name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
          cache-dependency-path: |
            pubspec.lock
            **/pubspec.yaml
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift database
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true
          cache-dependency-path: |
            pubspec.lock
            **/pubspec.yaml
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift database
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Windows Exe
        run: flutter build windows --release
      - name: Upload Windows Exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/bookkeeping.exe
          retention-days: 1

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
          cache-dependency-path: |
            pubspec.lock
            **/pubspec.yaml
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Cache CocoaPods and Ruby gems
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/RubyGems
          key: ${{ runner.os }}-cocoapods-ruby-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-ruby-
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod repo update
      - name: Flutter pub get
        run: flutter pub get
      - name: Build macOS
        run: |
          flutter clean
          flutter build macos --release
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build DMG
        run: |
          APP_NAME="Bookkeeping"
          BUILD_DIR="build/macos/Build/Products/Release"
          OUTPUT_DIR="build/macos/dmg"
          mkdir -p "$OUTPUT_DIR"
          create-dmg \
            --volname "$APP_NAME Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 175 120 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 425 120 \
            "$OUTPUT_DIR/$APP_NAME.dmg" "$BUILD_DIR"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/dmg/*.dmg

  release:
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/android
        continue-on-error: true

      - name: Download Windows Exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/windows
        continue-on-error: true

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release/macos
        continue-on-error: true

      - name: Verify Artifacts
        run: |
          echo "=== Android APK ===" && ls -la release/android/ || echo "No Android APK found"
          echo "=== Windows EXE ===" && ls -la release/windows/ || echo "No Windows EXE found"
          echo "=== macOS DMG ===" && ls -la release/macos/ || echo "No macOS DMG found"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/android/*.apk
            release/windows/*.exe
            release/macos/*.dmg
          generate_release_notes: true
